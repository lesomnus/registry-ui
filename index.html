<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registry UI</title>
  </head>
  <body>
    <!--
      The registry lives in the corner, over the page rather than above it.
      A row of its own was a row spent on a domain and a number the repository
      pane already shows.

      Nothing here is in the document flow, so `main` gets the whole window. The
      form grows downward when it opens and the domain does not move: it is the
      first thing in the form, the form's padding is the same in both states,
      and the input's border is transparent when shut rather than absent. Its
      width comes from `size` rather than from the form, so the box it sits in
      is the same whether the card behind it is there or not.
    -->
    <div id="corner">
      <div id="brand" hidden><img id="logo" alt="" hidden /><span id="title"></span></div>

      <form id="connection">
        <input
          id="domain"
          type="text"
          size="24"
          placeholder="registry.example"
          autocomplete="off"
          spellcheck="false"
          aria-label="Registry"
        />
        <div id="connection-more">
          <input id="username" type="text" placeholder="username" autocomplete="username" />
          <input id="password" type="password" placeholder="password or token" autocomplete="current-password" />
          <input
            id="forwarder"
            type="text"
            placeholder="forwarder URL (only if not direct)"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="connection-row">
            <label class="direct" id="insecure-label"><input id="insecure" type="checkbox" /> http</label>
            <label class="direct" id="direct-label"><input id="direct" type="checkbox" /> direct</label>
            <span class="spacer"></span>
            <button id="reset" class="toggle" type="button" title="Forget what this browser remembers">reset</button>
            <button id="open" type="submit">Open</button>
          </div>
        </div>
      </form>

      <p id="status" class="status" hidden></p>
    </div>
    <div id="scrim" hidden></div>

    <main>
      <section class="pane">
        <div class="pane-head">
          <h2>Repositories</h2>
          <span class="count" id="repository-count"></span>
          <!-- Label and pressed state are set from the state it toggles. -->
          <button id="view-toggle" class="toggle" type="button" title="Group by prefix, or list every name"></button>
        </div>
        <input id="repository-filter" type="search" placeholder="Filter repositories" autocomplete="off" />
        <div class="list" id="repository-list"><p class="empty">Not connected.</p></div>
      </section>

      <section class="pane">
        <div class="pane-head">
          <h2>Tags</h2>
          <span class="count" id="tag-count"></span>
        </div>
        <div class="list" id="tag-list"><p class="empty">Pick a repository.</p></div>
      </section>

      <section class="pane detail">
        <div class="pane-head"><h2>Image</h2></div>
        <div id="detail"><p class="empty">Pick a tag.</p></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
