<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registry UI</title>
  </head>
  <body>
    <!--
      The registry lives in the corner, over the page rather than above it.
      A row of its own was a row spent on a domain and a number the repository
      pane already shows.

      Nothing here is in the document flow, so `main` gets the whole window. The
      form grows downward when it opens and the domain does not move: it is the
      first thing in the form, the form's padding is the same in both states,
      and the input's border is transparent when shut rather than absent. Its
      width comes from `size` rather than from the form, so the box it sits in
      is the same whether the card behind it is there or not.
    -->
    <div id="corner">
      <div id="brand" hidden><img id="logo" alt="" hidden /><span id="title"></span></div>

      <form id="connection">
        <input
          id="domain"
          type="text"
          size="24"
          placeholder="registry.example"
          autocomplete="off"
          spellcheck="false"
          aria-label="Registry"
        />
        <div id="connection-more">
          <input id="username" type="text" placeholder="username" autocomplete="username" />
          <input id="password" type="password" placeholder="password or token" autocomplete="current-password" />
          <input
            id="forwarder"
            type="text"
            placeholder="forwarder URL (only if not direct)"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="connection-row">
            <label class="direct" id="insecure-label"><input id="insecure" type="checkbox" /> http</label>
            <label class="direct" id="direct-label"><input id="direct" type="checkbox" /> direct</label>
            <span class="spacer"></span>
            <button id="reset" class="toggle" type="button" title="Forget what this browser remembers">reset</button>
            <button id="open" type="submit">Open</button>
          </div>
        </div>
      </form>

      <p id="status" class="status" hidden></p>
    </div>
    <div id="scrim" hidden></div>

    <main>
      <section class="pane repositories">
        <div class="pane-head">
          <h2>Repositories</h2>
          <span class="count" id="repository-count"></span>
          <!--
            A switch rather than a toggle: both views are on screen and the one
            you are in is the one lit. The single button said "list" while
            showing the tree, which is a label that has to be read as a promise
            about the next click rather than as a description of this one.

            `aria-pressed` on each is set from the state, in one place.
          -->
          <div class="switch" role="group" aria-label="Repository view">
            <button id="view-list" type="button" title="Every name, in a flat list">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M2 3.4h2.2v1.6H2zM5.9 3.4H14v1.6H5.9zM2 7.2h2.2v1.6H2zM5.9 7.2H14v1.6H5.9zM2 11h2.2v1.6H2zM5.9 11H14v1.6H5.9z"
                />
              </svg>
              <span class="sr-only">List</span>
            </button>
            <button id="view-tree" type="button" title="Grouped by the prefixes the names share">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M2 2h12v1.6H2zM2.6 4.2h1.3v8.2H2.6zM3.9 6.5h2.4v1.4H3.9zM7 6.4h7V8H7zM3.9 10.8h2.4v1.4H3.9zM7 10.7h7v1.6H7z"
                />
              </svg>
              <span class="sr-only">Tree</span>
            </button>
          </div>
        </div>
        <input
          id="repository-filter"
          type="search"
          placeholder="Filter repositories, or /regex/"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="list" id="repository-list"><p class="empty">Not connected.</p></div>
      </section>

      <section class="pane tags">
        <div class="pane-head">
          <!--
            Only on a narrow window, where one pane is the whole screen and the
            panes beside it are the ones you came from. The stylesheet decides;
            they are always here so that nothing has to be told about a resize.
          -->
          <button id="back-to-repositories" class="back" type="button">&#8249; Repositories</button>
          <h2>Tags</h2>
          <span class="count" id="tag-count"></span>
        </div>
        <input
          id="tag-filter"
          type="search"
          placeholder="Filter tags, or /regex/"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="list" id="tag-list"><p class="empty">Pick a repository.</p></div>
      </section>

      <section class="pane detail">
        <div class="pane-head">
          <button id="back-to-tags" class="back" type="button">&#8249; Tags</button>
          <h2>Image</h2>
        </div>
        <div id="detail"><p class="empty">Pick a tag.</p></div>
      </section>

      <!--
        The manifest, when the window is wide enough to have it open beside the
        reading of it rather than underneath. Below that width the stylesheet
        drops this pane and the section at the bottom of the image takes over.
      -->
      <section class="pane source">
        <div class="pane-head">
          <h2>Manifest</h2>
          <span class="count" id="manifest-type"></span>
        </div>
        <div id="manifest"><p class="empty">Pick a tag.</p></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
