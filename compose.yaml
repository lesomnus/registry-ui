# Two shapes, and which one you want depends on one thing: whether the registry
# sends `Access-Control-Allow-Origin`.
#
#   it does      -- `page` alone, ticked "direct". Nothing is held, nothing is
#                   proxied, and the image has no runtime in it.
#   it does not  -- `served` alone. The page cannot reach the registry at all,
#                   so this asks on its behalf and holds the credential.
#
# They are alternatives. Running both is running two pages.
services:
  # The page, behind static-web-server. See Dockerfile.
  page:
    profiles: ["direct"]
    build: .
    ports: ["8080:8080"]
    environment:
      REGISTRY_DOMAIN: "registry.example"
      REGISTRY_LOCKED: "true"

  # The page and the forwarder, one process. See Dockerfile.server.
  served:
    profiles: ["forwarded"]
    build:
      context: .
      dockerfile: Dockerfile.server
    ports: ["8080:8080"]
    environment:
      # Pins the forwarder to this registry, which is what makes it safe for
      # this process to hold a credential for it.
      REGISTRY_UPSTREAM: "https://registry.example"

      # none | basic | bearer | jwt
      REGISTRY_AUTH: "bearer"
      REGISTRY_TOKEN: "" # or REGISTRY_TOKEN_FILE, which is what a secret is

      # The page is told what it is looking at, so there is nothing else here.
      # Whoever can reach this can read that registry: put it behind whatever
      # decides who that is.
      ALLOWED_ORIGIN: "http://localhost:8080"
